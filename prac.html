<!DOCTYPE html>
<html>

<head>
    <title>CJP LIST</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: rgb(255, 107, 1);
            margin: 20px;
        }

        .container {
            max-width: 700px;
            margin: 20px auto;
            background: linear-gradient(to bottom, rgb(255, 107, 1), white, green);
            border-radius: 20px;
            border-style: solid;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form,
        .search-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input,
        select,
        button {
            padding: 6px;
            border: 1px solid #999;
            font-size: 14px;
        }

        button {
            background: #eee;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #f2f2f2;
        }

        .no-record,
        .total {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Protest Participants</h1>

        <form id="studentForm">
            <input type="text" id="name" placeholder="Enter Name" required>

            <select id="branch" required>
                <option value="">Select Branch</option>
                <option value="CSE">CSE</option>
                <option value="CSE-DS">CSE-DS</option>
                <option value="CSE-AIML">CSE-AIML</option>
                <option value="ECE">ECE</option>
                <option value="ELCE">ELCE</option>
                <option value="MECHANICAL">MECHANICAL</option>
            </select>

            <button type="submit">Add Student</button>
        </form>

        <div class="search-filter">
            <input type="text" id="search" placeholder="Search by name">

            <select id="filterBranch">
                <option value="">Filter by Branch</option>
                <option value="CSE">CSE</option>
                <option value="CSE-DS">CSE-DS</option>
                <option value="CSE-AIML">CSE-AIML</option>
                <option value="ECE">ECE</option>
                <option value="ELCE">ELCE</option>
                <option value="MECHANICAL">MECHANICAL</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentBody"></tbody>
        </table>

        <div id="noRecord" class="no-record" style="display:none;">No record found</div>

        <div id="total" class="total">Total Students: 0</div>
    </div>

    <script>
        let students = [];

        const studentForm = document.getElementById("studentForm");
        const studentBody = document.getElementById("studentBody");
        const searchInput = document.getElementById("search");
        const filterBranch = document.getElementById("filterBranch");
        const noRecord = document.getElementById("noRecord");
        const total = document.getElementById("total");

        studentForm.addEventListener("submit", function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const branch = document.getElementById("branch").value;

            if (name && branch) {
                students.push({ name, branch });

                document.getElementById("name").value = "";
                document.getElementById("branch").value = "";

                renderStudents();
            }
        });

        function deleteStudent(index) {
            students.splice(index, 1);
            renderStudents();
        }

        function renderStudents() {
            const searchText = searchInput.value.toLowerCase();
            const branchFilter = filterBranch.value;

            const filtered = students
                .map((student, index) => ({ ...student, index }))
                .filter(student =>
                    student.name.toLowerCase().includes(searchText) &&
                    (branchFilter ? student.branch === branchFilter : true)
                );


            studentBody.innerHTML = "";

            if (filtered.length === 0) {
                noRecord.style.display = "block";
            } else {
                noRecord.style.display = "none";

                filtered.forEach((s) => {
                    studentBody.innerHTML += `
            <tr>
              <td>${s.name}</td>
              <td>${s.branch}</td>
              <td>
                <button onclick="deleteStudent(${s.index})">Delete</button>
              </td>
            </tr>
          `;
                });
            }

            total.textContent = "Total Students: " + students.length;
        }

        searchInput.addEventListener("input", renderStudents);
        filterBranch.addEventListener("change", renderStudents);
    </script>
</body>

</html>
