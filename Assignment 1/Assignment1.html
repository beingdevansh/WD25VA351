<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="Quiz">

        <div id="studentSection">
            <h1>MID TERM-1 QUIZ</h1>
            <p>Enter your details</p>

            <form id="studentForm">
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Enter your Name" required>

                <label for="admno">Admission No.:</label>
                <input type="text" id="admno" placeholder="Enter your Admission No." required>

                <label>Branch:</label>
                <div class="radio-group">
                    <label><input type="radio" name="branch" value="CSE" required> CSE</label>
                    <label><input type="radio" name="branch" value="CSE DS"> CSE DS</label>
                    <label><input type="radio" name="branch" value="AIML"> AIML</label>
                    <label><input type="radio" name="branch" value="ECE"> ECE</label>
                    <label><input type="radio" name="branch" value="ELCE"> ELCE</label>
                </div>

                <label>Section:</label>
                <div class="radio-group">
                    <label><input type="radio" name="section" value="A" required> A</label>
                    <label><input type="radio" name="section" value="B"> B</label>
                    <label><input type="radio" name="section" value="C"> C</label>
                </div>

                <button type="submit">Start Quiz</button>
            </form>
        </div>

        <div id="quizSection">
            <div class="quiz-header">
                <h1>Quiz</h1>
                <div id="questionCounter">Question 1 of 5</div>
                <div id="timer">01:00</div>
            </div>

            <div id="questionContainer"></div>

            <button type="button" id="nextButton">Next Question</button>
        </div>

        <div id="resultSection">
            <h1>Quiz Submitted</h1>
            <p id="studentName"></p>
            <h2 id="score"></h2>
            <p id="message">Your quiz has been submitted successfully.</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
